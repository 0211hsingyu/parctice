<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<div id="game">
    請輸入任意數字:
    <input type="number" id="txtNo">
    <button onclick="btnClick()">確定</button>
</div>
<p id="result"></p>

<button id="rePlay" onclick="btnReset()" style="display: none;">再玩一次</button>


<script>
let rePlay = document.getElementById('rePlay');
let game = document.getElementById('game');    
let result = document.getElementById('result');

let rd = Math.floor(Math.random()*100)+1;
let min = 1;
let max = 100;
let count=0;
let txtNo = "";


function btnClick(){
    
    txtNo = document.getElementById('txtNo');
    let keyNum = parseInt(txtNo.value);
    if(isNaN(keyNum)){
        alert("不能空白，重新輸入");
        txtNo.focus();
        return;
    }
    count++
    if(keyNum==rd){
        result.innerHTML += `第${count}次，Bingo`;
        game.style.display="none";
        rePlay.style.display="block";
        return;
    }
    
    if(keyNum>rd){
        max=keyNum-1;
        result.innerHTML+=`第${count}次，太大了，${min}~${max}<br>`;
    }else{
       min=keyNum+1;
       result.innerHTML+=`第${count}次，太小了，${min}~${max}<br>`; 
    }
    
    txtNo.value="";
    txtNo.focus();
}
function btnReset(){
    txtNo.value="";
    result.innerHTML="";
    min=1;
    max=100;
    count=0;
    rd = Math.floor(Math.random()*100)+1;
    
    game.style.display="block";
    rePlay.style.display="none";
    txtNo.focus();
}

</script>

</body>
</html>
